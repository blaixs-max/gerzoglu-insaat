name: CMS database health

on:
  schedule:
    # Every six hours, away from the busiest top-of-hour scheduling period (UTC).
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-database-health
  cancel-in-progress: false

jobs:
  database:
    # Enable only after the dedicated project, migration and public RLS are verified.
    if: ${{ vars.CMS_HEALTH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/check-cms-health.cjs
          sparse-checkout-cone-mode: false
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read public project catalogue from the database
        run: node scripts/check-cms-health.cjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
