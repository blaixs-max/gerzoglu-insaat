<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#171b20">
  <title>Proje Yönetimi · Gerzoğlu İnşaat</title>
  <link rel="icon" href="/assets/logo/favicon-silver-20261009.ico">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/admin/admin.css">
  <script type="module" src="/assets/admin/admin.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>
  <div id="app" aria-busy="true"><main class="initial-loading" id="main"><span class="spinner" aria-hidden="true"></span><p>Yönetim paneli hazırlanıyor…</p></main></div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="dialog-title"><form method="dialog"><div class="dialog-icon" aria-hidden="true">!</div><h2 id="dialog-title"></h2><p id="dialog-message"></p><div class="dialog-actions"><button class="button button--quiet" value="cancel">Vazgeç</button><button class="button button--primary" id="dialog-confirm" value="confirm">Devam et</button></div></form></dialog>
  <dialog id="history-dialog" class="history-dialog" aria-labelledby="history-title"><div class="dialog-top"><div><span class="eyebrow">Yayın geçmişi</span><h2 id="history-title">Önceki sürümler</h2></div><button class="icon-button" type="button" data-action="close-history" aria-label="Yayın geçmişini kapat">×</button></div><p class="muted">Bir sürümü geri yüklemek yalnızca taslağı değiştirir. Canlıya almak için ayrıca yayımlayın.</p><div id="history-list"></div></dialog>
  <noscript><p class="noscript">Yönetim panelini kullanmak için tarayıcınızda JavaScript’i etkinleştirin.</p></noscript>
</body>
</html>
